<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 572" width="360" height="572" class="hiw" role="img" aria-labelledby="hiw-title hiw-desc">
<title id="hiw-title">How requests reach a model through capyctl</title>
<desc id="hiw-desc">Your apps send requests to one OpenAI-compatible endpoint with an API key. capyctl, the server, holds a router that sends each request to the engine running its model, a scheduler that parks, wakes and switches models, and a memory ledger that counts the GPU and host memory each model holds. Over a private network with mutual TLS it drives hosts. Host gpu-box has a discrete 24 GB GPU running a vLLM model that is ready, and an SGLang model that is parked with its weights copied to host RAM. Host workstation has 128 GB of unified memory running a vLLM model that is ready and another that is parked. Engines listen on loopback only; only capyctl talks to them.</desc>
<style>
.hiw{--hiw-ink:var(--sl-color-white,#1c1917);--hiw-muted:var(--sl-color-gray-3,#57534e);--hiw-line:var(--sl-color-gray-4,#78716c);--hiw-box:var(--sl-color-gray-6,#f5f5f4);--hiw-bg:var(--sl-color-black,#ffffff);--hiw-hot:var(--sl-color-accent-low,#ffedd5);--hiw-accent:var(--sl-color-accent,#c2410c);max-width:100%;height:auto;font-family:var(--sl-font,system-ui,sans-serif)}
@media (prefers-color-scheme:dark){.hiw{--hiw-ink:var(--sl-color-white,#fafaf9);--hiw-muted:var(--sl-color-gray-3,#a8a29e);--hiw-line:var(--sl-color-gray-4,#78716c);--hiw-box:var(--sl-color-gray-6,#292524);--hiw-bg:var(--sl-color-black,#1c1917);--hiw-hot:var(--sl-color-accent-low,#431407);--hiw-accent:var(--sl-color-accent,#fb923c)}}
.hiw text{fill:var(--hiw-ink);font-size:12px}
.hiw .hiw-m{fill:var(--hiw-muted);font-size:10.5px}
.hiw .hiw-b{font-weight:600}
.hiw .hiw-a{fill:var(--hiw-accent);font-weight:600}
.hiw .hiw-box{fill:var(--hiw-box);stroke:var(--hiw-line);stroke-width:1}
.hiw .hiw-hot{fill:var(--hiw-hot);stroke:var(--hiw-accent);stroke-width:1.5}
.hiw .hiw-park{fill:var(--hiw-bg);stroke:var(--hiw-line);stroke-width:1;stroke-dasharray:4 3}
.hiw .hiw-arrow{stroke:var(--hiw-line);stroke-width:1.5;fill:none;marker-end:url(#hiw-head)}
.hiw .hiw-head{fill:var(--hiw-line)}
</style>
