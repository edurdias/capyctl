# capyctl standalone role document: an embedded server and host on one machine,
# with authenticated listeners. `capyctl start standalone` generates this shape
# under its state directory when none exists. The engine installation is
# named here (`host.local_engine`), by a flag (--vllm-bin) or by a variable
# (CAPYCTL_VLLM_BIN); a flag wins over a variable, which wins over this file
# (docs/operations/configuration.md lists every setting). Inference listens on
# all interfaces and requires the API key; management stays on loopback
# (docs/operations/network-access.md). The listeners serve plain HTTP, so
# there is no `tls` block: use a private network or a TLS reverse proxy.
# Models live in ~/models unless `host.model_store.path` (or --models-root,
# CAPYCTL_MODELS_ROOT) names another directory; Hugging Face and HTTP downloads
# are allowed with a 500 GiB cap unless `host.model_sources` says otherwise.
# Parsed by the product: `capyctl validate config --file docs/examples/standalone.yaml`.
schema_version: 1
kind: standalone
name: local
server:
  name: local
  state_dir: /home/operator/.local/state/capyctl/server
  listeners:
    management:
      bind: "127.0.0.1:7443"
      authentication: admin_token
    inference:
      bind: "0.0.0.0:8443"
      authentication: api_key
host:
  name: local
  state_dir: /home/operator/.local/state/capyctl/host
  connection: embedded
  resource_policy:
    allowed_devices: auto
    memory:
      accounting: auto
      system:
        managed_limit: auto   # 50 % of memory; or a size ("90GiB") or a share ("75%")
        free_reserve: auto    # 20 % of memory; or a size or a share
        parked_limit: auto    # 25 % of memory, what parked models may hold; a size or a share, at most the managed limit
    # Optional request queue bounds, as on a host (defaults shown):
    # queue:
    #   request_deadline: "1800s"     # until the first output, prefill included
    #   stream_idle_timeout: "120s"   # longest silence after the first output
  runtime_profiles: {}
  # Optional (defaults shown in comments):
  # model_store:
  #   path: /home/operator/models
  # model_sources:
  #   huggingface: allowed      # or disabled
  #   http: allowed             # or disabled
  #   max_bytes: 500GiB
  # local_engine:
  #   vllm: /opt/vllm/bin/vllm  # or sglang: /opt/sglang/bin/python3
  #   deep_park: "on"           # or "off"
  #   installation_drift: warn  # or refuse
  # runtime_dir: /home/operator/capyctl/runtime   # development only
shutdown:
  drain_timeout: "30s"
