# mllm standalone role document: an embedded server and host on one machine,
# with local-only authenticated listeners. `mllm start standalone` generates
# this shape under its state directory when none exists. The engine
# installation is named here (`host.local_engine`), by a flag (--vllm-bin) or
# by a variable (MLLM_VLLM_BIN); a flag wins over a variable, which wins over
# this file (docs/operations/configuration.md lists every setting). The listeners serve plain HTTP on loopback, so
# there is no `tls` block (SPEC §16.5). Models live in ~/models unless
# `host.model_store.path` (or --models-root, MLLM_MODELS_ROOT) names another
# directory; Hugging Face and HTTP downloads are allowed with a 500 GiB cap
# unless `host.model_sources` says otherwise.
# Parsed by the product: `mllm validate config --file docs/examples/standalone.yaml`.
schema_version: 1
kind: standalone
name: local
server:
  name: local
  state_dir: /home/operator/.local/state/mllm/server
  listeners:
    management:
      bind: "127.0.0.1:7443"
      authentication: admin_token
    inference:
      bind: "127.0.0.1:8443"
      authentication: api_key
host:
  name: local
  state_dir: /home/operator/.local/state/mllm/host
  connection: embedded
  resource_policy:
    allowed_devices: auto
    memory:
      accounting: auto
      system:
        managed_limit: auto
        free_reserve: auto
  runtime_profiles: {}
  # Optional (defaults shown in comments):
  # model_store:
  #   path: /home/operator/models
  # model_sources:
  #   huggingface: allowed      # or disabled
  #   http: allowed             # or disabled
  #   max_bytes: 500GiB
  # local_engine:
  #   vllm: /opt/vllm/bin/vllm  # or sglang: /opt/sglang/bin/python3
  #   deep_park: "on"           # or "off"
  #   installation_drift: warn  # or refuse
  # runtime_dir: /home/operator/mllm/runtime   # development only
shutdown:
  drain_timeout: "30s"
