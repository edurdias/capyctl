# capyctl host role document (`capyctl start host --config host.yaml`) for a
# unified-memory host (one memory pool shared by device and system).
# Parsed by the product: `capyctl validate config --file docs/examples/host.yaml`.
# An illustration of the schema, not a tested engine recipe: executables,
# fingerprints and limits are placeholders for the host's own values.
schema_version: 1
kind: host
name: gpu-box
state_dir: /var/lib/capyctl/host
# Must be `<state_dir>/identity`.
identity_dir: /var/lib/capyctl/host/identity
# capyctl's runtime helpers are compiled into the binary and written, owner-only,
# to <state_dir>/runtime at every start. Name runtime_dir only to run from a
# directory you maintain yourself (development); capyctl never writes to it.
# runtime_dir: /home/operator/capyctl/runtime
# The host's own installation may also be named here instead of (or besides)
# runtime_profiles; it is published as the profile `local` (both engines:
# `local-vllm` and `local-sglang`). --vllm-bin or CAPYCTL_VLLM_BIN name it too
# (docs/operations/configuration.md).
# local_engine:
#   vllm: /opt/vllm/bin/vllm
#   cuda_home: /usr/local/cuda   # or --cuda-home, CAPYCTL_CUDA_HOME
hardware_fingerprint: example-hw-1
environment_fingerprint: example-env-1
# Relative model paths in deployments resolve under this directory.
model_store:
  path: /srv/models
# The private ingress the server forwards inference to (loopback or a
# 100.64.0.0/10 overlay-network address, such as a Tailscale tailnet).
ingress:
  transport: trusted_private_link
  address: "http://100.64.0.21:8444"
  bind: "100.64.0.21:8444"
load_report_interval: "1s"
shutdown:
  drain_timeout: "30s"
resource_policy:
  domains:
    unified:
      memory: unified
      managed_limit: "96GiB"
      free_reserve: "12GiB"
      parked_limit: "16GiB"
      host_kv_limit: "8GiB"
  devices:
    gpu0:
      domain: unified
      sharing: shared
  device_sharing: shared
  max_parked: 3
  observation_ttl: "2s"
  endpoint_port_range:
    start: 8100
    end: 8199
  planner_max_states: 4096
  queue:
    admission_window: "2s"
    max_pending_per_deployment: 64
    max_pending_total: 256
    max_buffered_bytes_total: "64MiB"
    request_deadline: "1800s"
    stream_idle_timeout: "120s"
  # Deployments select hosts by these labels (`placement.selector`).
  labels:
    site: lab
    accelerator: example-gpu
  # One model across machines (docs/guide/several-machines.md): the address
  # this host's group peers reach it on, over the direct link. A host without
  # it is never named in a group. Also `--peer-address` or
  # CAPYCTL_PEER_ADDRESS. docs/examples/host-b.yaml is the second host.
  groups:
    peer_address: 192.0.2.10
    # The head's rendezvous ports (default 25000-25099), and whether a missing
    # memlock or InfiniBand setting refuses a group (default false: warn).
    # rendezvous_port_range: {start: 25000, end: 25099}
    # require_rdma: false
# Engine installations. Engine tuning belongs to each deployment's
# `engine_config`; a profile keeps host-fixed settings only.
runtime_profiles:
  vllm:
    engine: vllm
    revision: 1
    executable: /opt/vllm/bin/vllm
    build_fingerprint: "vllm 0.29.0"
    args: []
    # Optional: the CUDA toolkit whose bin/ joins the engine PATH (vLLM needs
    # nvcc there to use FlashInfer). Omit it to keep the minimal PATH.
    cuda_home: /usr/local/cuda
    # Optional overrides of the JIT build limits capyctl computes at launch
    # (MAX_JOBS = free memory, less the deployment's Ready charge on unified
    # memory, / 8 GiB, at most the CPU count, at least 1).
    env: {}
    log_policy:
      max_file_bytes: "16MiB"
      retained_files: 3
    security:
      # Deep parking is on unless a host opts out with `disabled`.
      deep_park: enabled
      trust_remote_code: false
      credential_ref: "secret://engine-key"
      # `warn` (default) or `refuse` when the installation's files change
      # after the agent registered them.
      installation_drift: warn
  sglang:
    engine: sglang
    revision: 1
    executable: /opt/sglang/bin/python3
    build_fingerprint: "sglang 0.5.20"
    args: []
    env: {}
    log_policy:
      max_file_bytes: "16MiB"
      retained_files: 3
    security:
      deep_park: enabled
      trust_remote_code: false
      credential_ref: "secret://engine-key"
      admin_credential_ref: "secret://admin-key"
      installation_drift: refuse
