# One model across two hosts: a group of two tensor-parallel ranks, one per
# host (docs/guide/several-machines.md, "One model across machines"). The first
# host in placement.hosts is the head: it runs rank 0 and serves the API. The
# second runs rank 1. Each named host must declare its peer address
# (resource_policy.groups.peer_address in docs/examples/host.yaml and
# docs/examples/host-b.yaml) and publish the `vllm` profile with the same build.
# Parsed by the product: `capyctl validate config --file docs/examples/deployment-multinode.yaml
# --host docs/examples/host.yaml` resolves it on the head.
# An illustration of the schema, not a tested engine recipe.
name: qwen3-30b-tp2
engine: vllm
# The same path on both hosts (a SGLang group with `residency: deep` requires it).
model: qwen3-30b-a3b
topology:
  tensor_parallel: 2
  pipeline_parallel: 1
placement:
  hosts: ["gpu-box", "host-b"]
residency: deep
# Per member: each host charges its own rank this much.
engine_config:
  memory:
    request: "40GiB"
timeouts:
  initialize: "1800s"
