# mllm server role document (`mllm start server --config server.yaml`).
# Parsed by the product: `mllm validate config --file docs/examples/server.yaml`.
# An illustration of the schema, not a tested deployment of any engine.
schema_version: 1
kind: server
name: lab
state_dir: /var/lib/mllm/server
# Must be `<state_dir>/identity`.
identity_dir: /var/lib/mllm/server/identity
listeners:
  # Management and inference stay on loopback (SPEC §16.5).
  management:
    bind: "127.0.0.1:7443"
    authentication: token
  inference:
    bind: "127.0.0.1:8443"
    authentication: api_key
  # Host agents enroll through bootstrap and hold their control session here.
  bootstrap:
    bind: "100.64.0.10:7444"
    authentication: server_tls
  control:
    bind: "100.64.0.10:7445"
    authentication: mutual_tls
enrollment:
  # One certificate name for both addresses.
  bootstrap_address: "https://mllm.lab:7444"
  control_address: "https://mllm.lab:7445"
lifecycle_defaults:
  ready_idle_timeout: "5m"
  parked_idle_timeout: "30m"
control:
  heartbeat_suspend_after: "5s"
  heartbeat_lost_after: "30s"
shutdown:
  drain_timeout: "30s"
