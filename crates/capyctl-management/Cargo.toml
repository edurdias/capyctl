[package]
name = "capyctl-management"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
tokio.workspace = true
capyctl-store.workspace = true
capyctl-controller.workspace = true
capyctl-protocol.workspace = true
capyctl-config.workspace = true
capyctl-agent.workspace = true
capyctl-domain.workspace = true
serde_json = "1"
sha2.workspace = true
subtle = "2"
libc = "0.2"
futures.workspace = true
ulid.workspace = true
serde.workspace = true
# ADR 0040 §4: 256-bit session and sign-in link tokens from the OS generator.
rand_core = { version = "0.6", features = ["getrandom"] }
hex.workspace = true
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
async-trait.workspace = true
reqwest.workspace = true
capyctl-adapters.workspace = true
capyctl-testkit.workspace = true
capyctl-scheduler.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
# SPEC §§10, 17: the load route served with the router's composed report.
capyctl-router = { path = "../capyctl-router" }
# ADR 0040 §§9–10: real server-to-host mTLS management tests.
tonic = { workspace = true, features = ["tls-ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
