[package]
name = "capyctl-router"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
capyctl-adapters = { workspace = true }
# SPEC §§10, 17: the derived running limit the load read reports.
capyctl-config = { workspace = true }
capyctl-controller = { path = "../capyctl-controller" }
capyctl-domain = { workspace = true }
capyctl-store = { path = "../capyctl-store" }
# Only for `reqwest::Url`: the adapter forwarder is built from a parsed base URL,
# and parsing it here keeps a malformed stored endpoint a router-side refusal.
reqwest = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
futures = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
# SPEC §13.3: constant-time comparison of the inference API key.
subtle = "2"

[dev-dependencies]
capyctl-testkit = { workspace = true }
# SPEC §17 (M80): host latency reports in the timing tests.
capyctl-protocol = { workspace = true }
async-trait = { workspace = true }
tower = { version = "0.5", features = ["util"] }
futures = { workspace = true }
async-stream = "0.3"
