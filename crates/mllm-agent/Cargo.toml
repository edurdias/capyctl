[package]
name = "mllm-agent"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
mllm-domain = { workspace = true }
mllm-config.workspace = true
ulid.workspace = true
mllm-scheduler = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
time = "0.3"
x509-parser = { version = "0.18", features = ["verify"] }

libc = "0.2"
serde.workspace = true
serde_json = "1"
mllm-protocol.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }

tempfile.workspace = true

rusqlite.workspace = true
prost.workspace = true
mllm-launchers = { path = "../mllm-launchers" }
mllm-adapters.workspace = true

tokio = { workspace = true }
tokio-stream = "0.1"

axum.workspace = true
reqwest.workspace = true
futures.workspace = true
async-trait = { workspace = true }
subtle = "2"

[dev-dependencies]
