# Check the project site (site/) on pull requests and publish it to GitHub Pages
# on pushes to main or manual runs from main. The build runs the CLI to generate the CLI reference and the
# landing page's terminal output, so it needs the Rust toolchain as well as
# Node. It runs only once the repository is public and Pages is enabled with
# "GitHub Actions" as its source.
#
# The build runs only when something the site is made from changed (the
# `changes` job). `build` is a required check, so it is skipped by its `if:`
# rather than by an `on.paths` filter: a skipped job satisfies a required
# check, while a workflow that never starts leaves the check waiting.
name: site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        name: Did a site input change?
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        # Keep this list in step with what site/ reads: site/scripts/pages.mjs
        # (the synced docs pages), site/site.config.mjs (the workspace version
        # in Cargo.toml) and site/scripts/gen-cli.mjs and gen-hero.mjs (the
        # capyctl-cli examples).
        run: |
          inputs='^(site/|docs/guide/|docs/operations/configuration\.md$|docs/operations/network-access\.md$|crates/capyctl-cli/(src|examples)/|crates/capyctl-cli/Cargo\.toml$|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/site\.yml$)'
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$SHA" ;;
            *) range="" ;;
          esac
          if [ -z "$range" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            site=true
          elif git diff --name-only "$range" | grep -Eq "$inputs"; then
            site=true
          else
            site=false
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "Site inputs changed: $site" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: changes
    if: github.event.repository.private == false && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Fetch crates
        run: cargo fetch --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build and check
        working-directory: site
        env:
          # The production URLs are the defaults in site/scripts/lib/settings.mjs;
          # a publish build refuses an empty or placeholder value.
          CAPYCTL_PUBLISH: "1"
        run: npm run check
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event.repository.private == false && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
