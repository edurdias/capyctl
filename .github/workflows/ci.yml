name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    # Keep automatic checks off while the repository is private.
    if: github.event.repository.private == false
    name: CPU checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential protobuf-compiler pkg-config libssl-dev python3 curl patch shellcheck
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Name check
        run: scripts/check-name.sh
      - name: Authoritative core suite
        run: >-
          cargo test -p capyctl-adapters -p capyctl-store -p capyctl-controller
          -p capyctl-management -p harness --all-targets --no-fail-fast --locked
          -- --test-threads=4
      - name: Workspace suite
        run: cargo test --workspace --all-targets --no-fail-fast --locked
      - name: Core Clippy
        run: >-
          cargo clippy -p capyctl-adapters -p capyctl-store -p capyctl-controller
          -p capyctl-management -p harness --all-targets --locked -- -D warnings
      - name: Fetch and verify CPU fixture source
        run: |
          TMS_SOURCE_ARCHIVE="$RUNNER_TEMP/torch_memory_saver-0.0.9.post1.tar.gz"
          echo "TMS_SOURCE_ARCHIVE=$TMS_SOURCE_ARCHIVE" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --output "$TMS_SOURCE_ARCHIVE" \
            https://files.pythonhosted.org/packages/81/fd/42aad783d433fd69dc108b1b2ee5860fcf33e20e5440b899bc004ff97d70/torch_memory_saver-0.0.9.post1.tar.gz
          printf '%s  %s\n' 25fd4b691ed3242c3a18b2bef0dbe9de84d2e7068b96a37686a923d55c274f43 "$TMS_SOURCE_ARCHIVE" | sha256sum --check -
      - name: Runtime CPU tests
        run: python3 -m unittest discover -s runtime/tests -p 'test_*.py' -v
      - name: Packaging shell checks
        run: shellcheck packaging/release.sh packaging/install.sh scripts/verify-packaging.sh scripts/check-release-clean.sh scripts/test-install.sh scripts/check-name.sh
      - name: Installer fixtures
        run: scripts/test-install.sh
      - name: Record scope
        run: echo 'CPU and Fake-engine tests are not native engine recipe qualification.' >> "$GITHUB_STEP_SUMMARY"

  formal:
    # Keep automatic checks off while the repository is private.
    if: github.event.repository.private == false
    name: Formal models
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Lean toolchain manager (pinned, verified)
        run: |
          ELAN_INIT="$RUNNER_TEMP/elan-init.sh"
          curl --fail --location --retry 3 --output "$ELAN_INIT" \
            https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          printf '%s  %s\n' a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53 "$ELAN_INIT" | sha256sum --check -
          sh "$ELAN_INIT" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check every proof
        working-directory: formal
        run: |
          lake build
          if grep -rnw sorry CapyFormal; then
            echo 'a proof is incomplete' >&2
            exit 1
          fi
      - name: Record scope
        run: echo 'Formal models are evidence about the modelled logic, not native engine recipe qualification.' >> "$GITHUB_STEP_SUMMARY"
